<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Gen - 3D Modeling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                    <rect x="4" y="4" width="24" height="24" rx="4" fill="url(#gradient1)"/>
                    <path d="M10 16L16 10L22 16L16 22L10 16Z" fill="white" opacity="0.9"/>
                    <defs>
                        <linearGradient id="gradient1" x1="4" y1="4" x2="28" y2="28">
                            <stop stop-color="#667eea"/>
                            <stop offset="1" stop-color="#764ba2"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>Pro-Gen</h1>
            </div>
            
            <div class="header-actions">
                <div class="heat-toggle-container">
                    <label class="heat-toggle">
                        <input type="checkbox" id="heatToggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">🔥 Heat</span>
                    </label>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace">
            <!-- Left Toolbar -->
            <aside class="toolbar">
                <div class="tool-section">
                    <h3>Create</h3>
                    <button class="tool-btn" data-tool="cube" title="Add Cube (Shift+C)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M4 10L12 6L20 10" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 6V16" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Cube</span>
                    </button>
                    <button class="tool-btn" data-tool="sphere" title="Add Sphere (Shift+S)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
                            <ellipse cx="12" cy="12" rx="8" ry="3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Sphere</span>
                    </button>
                    <button class="tool-btn" data-tool="cylinder" title="Add Cylinder">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <ellipse cx="12" cy="6" rx="8" ry="3" stroke="currentColor" stroke-width="2"/>
                            <path d="M4 6V18C4 19.6569 7.58172 21 12 21C16.4183 21 20 19.6569 20 18V6" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Cylinder</span>
                    </button>
                    <button class="tool-btn" data-tool="cone" title="Add Cone">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M12 4L4 20H20L12 4Z" stroke="currentColor" stroke-width="2"/>
                            <ellipse cx="12" cy="20" rx="8" ry="2" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Cone</span>
                    </button>
                    <button class="tool-btn" data-tool="torus" title="Add Torus">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Torus</span>
                    </button>
                </div>

                <div class="tool-section">
                    <h3>Actions</h3>
                    <button class="tool-btn" id="duplicateBtn" title="Duplicate (Ctrl+D)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
                            <rect x="4" y="4" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Duplicate</span>
                    </button>
                    <button class="tool-btn" id="deleteBtn" title="Delete (Del)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Delete</span>
                    </button>
                    <button class="tool-btn" id="clearBtn" title="Clear All">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M4 4L20 20M20 4L4 20" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Clear</span>
                    </button>
                </div>

                <div class="tool-section">
                    <h3>View</h3>
                    <button class="tool-btn" id="resetViewBtn" title="Reset Camera (R)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M4 4V10H10M20 20V14H14M20 10C20 15.5228 15.5228 20 10 20C4.47715 20 0 15.5228 0 10C0 4.47715 4.47715 0 10 0C15.5228 0 20 4.47715 20 10Z" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Reset</span>
                    </button>
                    <button class="tool-btn" id="toggleGridBtn" title="Toggle Grid (G)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M4 4V20M20 4V20M4 12H20M4 8H20M4 16H20M12 4V20M8 4V20M16 4V20" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Grid</span>
                    </button>
                    <button class="tool-btn" id="wireframeBtn" title="Toggle Wireframe (W)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M4 4L12 8L20 4M4 4V20L12 16L20 20V4M12 8V16M4 12L12 16L20 12" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span>Wire</span>
                    </button>
                </div>
            </aside>

            <!-- Viewport -->
            <main class="viewport-container">
                <div id="viewport"></div>
                
                <!-- Heat Display Overlay -->
                <div id="heatOverlay" class="heat-overlay hidden">
                    <div class="heat-indicator">
                        <div class="heat-bar">
                            <div id="heatLevel" class="heat-level" style="width: 0%"></div>
                        </div>
                        <span id="heatValue">0°C</span>
                        <span id="heatStatus" class="heat-status safe">Safe</span>
                    </div>
                </div>


            <!-- Right Properties Panel -->
            <aside class="properties-panel">
                <div class="panel-section">
                    <h3>Properties</h3>
                    <div id="noSelection" class="no-selection">
                        <p>No object selected</p>
                        <small>Click an object or use scene list</small>
                    </div>
                    
                    <div id="objectProperties" class="object-properties hidden">
                        <div class="prop-group">
                            <label>Name</label>
                            <input type="text" id="objName" class="prop-input">
                        </div>
                        
                        <div class="prop-group">
                            <label>Position</label>
                            <div class="prop-row">
                                <input type="number" id="posX" step="0.1" class="prop-input-small" title="X">
                                <input type="number" id="posY" step="0.1" class="prop-input-small" title="Y">
                                <input type="number" id="posZ" step="0.1" class="prop-input-small" title="Z">
                            </div>
                        </div>
                        
                        <div class="prop-group">
                            <label>Scale</label>
                            <div class="prop-row">
                                <input type="number" id="scaleX" step="0.1" min="0.1" class="prop-input-small" title="X">
                                <input type="number" id="scaleY" step="0.1" min="0.1" class="prop-input-small" title="Y">
                                <input type="number" id="scaleZ" step="0.1" min="0.1" class="prop-input-small" title="Z">
                            </div>
                        </div>
                        
                        <div class="prop-group">
                            <label>Rotation</label>
                            <div class="prop-row">
                                <input type="number" id="rotX" step="15" class="prop-input-small" title="X">
                                <input type="number" id="rotY" step="15" class="prop-input-small" title="Y">
                                <input type="number" id="rotZ" step="15" class="prop-input-small" title="Z">
                            </div>
                        </div>
                        
                        <div class="prop-group">
                            <label>Color</label>
                            <input type="color" id="objColor" class="prop-color">
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Heat Analysis</h3>
                    <div class="heat-controls">
                        <label>Temp: <span id="tempValue">25</span>°C</label>
                        <input type="range" id="tempSlider" min="0" max="500" value="25" class="temp-slider">
                        <div class="heat-zones">
                            <span class="zone safe">&lt;150°</span>
                            <span class="zone moderate">150-300°</span>
                            <span class="zone danger">&gt;300°</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Scene</h3>
                    <div id="sceneList" class="scene-list">
                        <p class="empty-scene">No objects</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
